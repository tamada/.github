# Cuts a release tag and opens a draft GitHub release.
#
# Language-agnostic: it only tags and drafts. Building artefacts, publishing
# to a registry and anything else project-specific belongs in the jobs the
# caller runs between this and release-finish.
#
# Two branches are involved and they are not the same one:
#
#     releases/v0.0.5  ──── pull request ────▶  main
#           │                                    │
#     carries the version                  gets the tag
#     (version-branch-prefixes)            (tag-branch)
#
# The version is read from the head branch of the merged pull request; the tag
# is placed on the branch it merged into.
#
# Two forms of the same thing come out, and each name means one of them and
# only ever that one:
#
#     outputs.version   0.0.5    the bare version, for embedding in a binary
#     outputs.tag       v0.0.5   the git tag, for checking out or referring to
#
# The draft is deliberate. A release created as published by GITHUB_TOKEN does
# not fire `release: published`, so nothing downstream would notice it.
# release-finish takes the draft off with a token that does.
#
# Usage:
#
#   jobs:
#     start:
#       if: startsWith(github.head_ref, 'release') && github.event.pull_request.merged == true
#       uses: tamada/.github/.github/workflows/release-start.yaml@v1
#       permissions:
#         contents: write
#
#     build:
#       needs: start
#       # ... uses needs.start.outputs.version / .tag / .appname
#
#     finish:
#       needs: [start, build]
#       uses: tamada/.github/.github/workflows/release-finish.yaml@v1
#       with:
#         tag: ${{ needs.start.outputs.tag }}
#       permissions:
#         contents: write
#       secrets: inherit

name: release-start

on:
  workflow_call:
    inputs:
      version:
        description: >-
          Version to release, with or without the leading v — either is
          accepted and normalised. Left empty it is read from the head branch,
          by removing the matching version-branch-prefix. Pass it explicitly
          when the workflow is not triggered by a release branch.
        type: string
        required: false
        default: ""
      version-branch-prefixes:
        description: >-
          Space-separated prefixes the head branch may start with, everything
          after the matching one being the version. Tried in order, first
          match wins. Naming them rather than guessing means a branch that
          follows no convention fails instead of yielding something odd.
        type: string
        required: false
        default: releases/v release/v
      tag-branch:
        description: Branch that is checked out and tagged.
        type: string
        required: false
        default: main
      appname:
        description: >-
          Application name, used by later jobs to name artefacts. Defaults to
          the repository name, which is right whenever the binary is named
          after its repository.
        type: string
        required: false
        default: ""
    outputs:
      # Both forms are published so that no caller has to add or strip the v
      # itself. "version" is the bare number, "tag" is the git tag — the names
      # mean exactly what they say, everywhere.
      version:
        description: The resolved version, without the leading v (0.0.5).
        value: ${{ jobs.start.outputs.version }}
      tag:
        description: The git tag that was created, with the leading v (v0.0.5).
        value: ${{ jobs.start.outputs.tag }}
      appname:
        description: The resolved application name.
        value: ${{ jobs.start.outputs.appname }}

jobs:
  start:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.vars.outputs.version }}
      tag: ${{ steps.vars.outputs.tag }}
      appname: ${{ steps.vars.outputs.appname }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag-branch }}
          fetch-depth: 0

      # Values reach the script through the environment rather than through
      # ${{ }} interpolation, so a branch name is never spliced into the shell.
      - name: Resolve tag and application name
        id: vars
        env:
          VERSION_INPUT: ${{ inputs.version }}
          PREFIXES: ${{ inputs.version-branch-prefixes }}
          APPNAME_INPUT: ${{ inputs.appname }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          version="$VERSION_INPUT"
          if [ -z "$version" ]; then
            # A prefix has to match and leave something behind. Trimming to the
            # last "v" instead would read releases/v1.0-preview as "iew", and
            # would hand back the whole branch name when nothing matches —
            # both of which tag the wrong thing without complaining.
            #
            # Unquoted on purpose: the prefixes are a space-separated list.
            # shellcheck disable=SC2086
            for prefix in $PREFIXES; do
              case "$HEAD_REF" in
                "$prefix"?*) version="${HEAD_REF#"$prefix"}"; break ;;
              esac
            done
            if [ -z "$version" ]; then
              echo "::error::head branch '$HEAD_REF' starts with none of: $PREFIXES; pass the 'version' input instead"
              exit 1
            fi
          fi

          # Everything downstream is derived from this one bare value, so the
          # two published forms cannot drift apart. Accepting the v on input
          # costs nothing and spares the caller from caring which form it held.
          version="${version#v}"

          # Matching a prefix only proves the branch was named plausibly.
          # releases/vNEXT clears that bar and would be tagged as "NEXT"; so
          # would releases/v0.0.5/hotfix, as a tag with a slash in it. A
          # version starts with a digit and is made of digits, letters, dots,
          # plus and hyphen — 1.0-preview and 1.2.3+build pass, those two do not.
          case "$version" in
            [0-9]*) ;;
            *)
              echo "::error::version '$version' does not start with a digit; the branch is named like a release branch but does not carry a version"
              exit 1
              ;;
          esac
          case "$version" in
            *[!0-9A-Za-z.+-]*)
              echo "::error::version '$version' contains characters that do not belong in a version"
              exit 1
              ;;
          esac

          appname="${APPNAME_INPUT:-${GITHUB_REPOSITORY#*/}}"
          {
            echo "version=$version"
            echo "tag=v$version"
            echo "appname=$appname"
          } >> "$GITHUB_OUTPUT"
          echo "releasing $appname v$version from $GITHUB_REPOSITORY" >> "$GITHUB_STEP_SUMMARY"

      - name: Set git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # From here on the tag is used verbatim; nothing re-attaches the v.
      - name: Create and push tag
        env:
          TAG: ${{ steps.vars.outputs.tag }}
        run: |
          git tag "$TAG"
          git push origin "$TAG"

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.vars.outputs.tag }}
        run: |
          gh release create "$TAG" \
            --verify-tag \
            --generate-notes \
            --title "Release $TAG" \
            --draft
