name: Build the site by Hugo and Publish it

on:
  workflow_call:
    inputs:
      workdir:
        description: "The directory to build the site in"
        type: string
        default: "."
      branch:
        description: >-
          The branch (or any git ref) to build the site from. Left empty it is
          the ref that triggered the caller's run, which is what you want for
          the usual "push to the default branch" trigger.
        type: string
        default: ""
      hugo-version:
        description: "The version of Hugo to use"
        type: string
        default: "latest"

permissions:
  contents: read
  pages: write
  id-token: write

# A Pages site takes one deployment at a time; a second concurrent run is
# rejected by the API rather than queued. Never cancel one in flight, though —
# that would leave the site on whatever was half-deployed.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-site:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ inputs.branch }}
          # Hugo themes are commonly vendored as submodules; without this the
          # build fails on a missing layout rather than on a missing checkout.
          submodules: recursive

      - name: Setup hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ inputs.hugo-version }}
          extended: true

      # working-directory rather than `cd` in the script: the value is placed by
      # the runner, not spliced into a shell command line, so a caller cannot
      # smuggle anything through it.
      - name: Build and update site
        working-directory: ${{ inputs.workdir }}
        run: hugo --minify

      - name: Upload artifacts
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ inputs.workdir }}/public

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build-site
    steps:
      - id: deployment
        name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v5
